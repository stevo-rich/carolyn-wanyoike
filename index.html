<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bouquet for You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/pin-screen.css">
    <link rel="stylesheet" href="css/flower-animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- Background decorative elements -->
    <div class="bg-decoration">
        <img src="assets/images/flowers/sunflower.png" class="deco-flower sunflower-tl" alt="">
        <img src="assets/images/icons/crescent-moon.png" class="deco-moon" alt="">
        <img src="assets/images/icons/heart-lock.png" class="deco-lock" alt="">
        <img src="assets/images/icons/key.png" class="deco-key" alt="">
        <img src="assets/images/icons/heart.png" class="deco-heart-tr" alt="">
        <img src="assets/images/flowers/tulip.png" class="deco-tulip" alt="">
        <img src="assets/images/icons/cloud.png" class="deco-cloud cloud-1" alt="">
        <img src="assets/images/icons/cloud.png" class="deco-cloud cloud-2" alt="">
        <img src="assets/images/icons/cloud.png" class="deco-cloud cloud-3" alt="">
        <img src="assets/images/flowers/rose-yellow.png" class="deco-flower rose-bl" alt="">
        <img src="assets/images/flowers/daffodil.png" class="deco-flower daffodil-br" alt="">
        <img src="assets/images/flowers/sunflower.png" class="deco-flower sunflower-br" alt="">

        <!-- Gold dots -->
        <div class="gold-dots">
            <span class="dot" style="top:15%;left:20%"></span>
            <span class="dot" style="top:25%;left:35%"></span>
            <span class="dot" style="top:10%;left:70%"></span>
            <span class="dot" style="top:80%;left:15%"></span>
            <span class="dot" style="top:85%;left:80%"></span>
            <span class="dot" style="top:40%;left:90%"></span>
            <span class="dot" style="top:60%;left:5%"></span>
        </div>
    </div>

    <!-- Main content -->
    <main class="pin-screen">
        <div class="lock-container">
            <div class="lock-wrapper">
                <img src="assets/images/icons/heart-lock.png" class="heart-lock" alt="Heart Lock">
                <img src="assets/images/icons/key.png" class="key" alt="Key">
            </div>

            <div class="names">
                <p class="from">From: <span class="sender-name">Wachira</span></p>
                <p class="to">For <span class="recipient-name">carolyne</span></p>
                <p class="hint">click to open</p>
            </div>

            <div class="pin-dots">
                <span class="dot" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
                <span class="dot" data-index="3"></span>
            </div>

            <div class="number-pad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
                <button class="num-btn" data-num="0">0</button>
                <button class="num-btn backspace">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Flower explosion container -->
    <div class="flower-explosion" id="flowerExplosion"></div>

    <!-- TikTok watermark -->
    <div class="watermark">@flowers_the_bloom</div>

    <script src="js/pin-validator.js"></script>
    <script src="js/flower-bloom.js"></script>

    <!-- Image load tester -->
    <script>
        // Test if flower images exist
        const testImages = ['sunflower', 'rose-yellow', 'rose-pink', 'daisy-purple', 'lily', 'tulip'];
        testImages.forEach(name => {
            const img = new Image();
            img.src = `assets/images/flowers/${name}.png`;
            img.onload = () => console.log(`✅ ${name} loaded`);
            img.onerror = () => console.error(`❌ ${name} FAILED - check path: assets/images/flowers/${name}.png`);
        });
    </script>
</body>

</html>
